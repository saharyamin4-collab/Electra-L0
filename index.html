<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>סידור משמרות CXelectra, בית שמש MDCIL4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{
  --bg:#ECEFF3; --surface:#FFFFFF; --surface-2:#F4F6F9; --ink:#0E1B29; --ink-2:#465566; --ink-3:#7A8796;
  --line:#D5DCE3; --line-2:#E6EBF0; --brand:#0E3256; --on-brand:#FFFFFF;
  --ph-m:#C98A10; --ph-a:#1B7FB0; --ph-e:#5B4DC9;
  --ph-m-soft:#FBF1DC; --ph-a-soft:#E1F0F8; --ph-e-soft:#ECE9FA;
  --ok:#1E8757; --mid:#7A8796; --warn:#B4541A; --danger:#B42335;
  --shadow:0 1px 2px rgba(14,27,41,.06), 0 8px 24px -12px rgba(14,27,41,.18);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B131C; --surface:#121D29; --surface-2:#182636; --ink:#E7EDF3; --ink-2:#A5B2C0; --ink-3:#73818F;
    --line:#263547; --line-2:#1E2C3B; --brand:#86B6E6; --on-brand:#0B131C;
    --ph-m:#E7A93A; --ph-a:#46A9DA; --ph-e:#8C80EE;
    --ph-m-soft:#2B2414; --ph-a-soft:#122938; --ph-e-soft:#1F1C3A;
    --ok:#46B583; --mid:#8C99A6; --warn:#E08048; --danger:#EA6270;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B131C; --surface:#121D29; --surface-2:#182636; --ink:#E7EDF3; --ink-2:#A5B2C0; --ink-3:#73818F;
  --line:#263547; --line-2:#1E2C3B; --brand:#86B6E6; --on-brand:#0B131C;
  --ph-m:#E7A93A; --ph-a:#46A9DA; --ph-e:#8C80EE;
  --ph-m-soft:#2B2414; --ph-a-soft:#122938; --ph-e-soft:#1F1C3A;
  --ok:#46B583; --mid:#8C99A6; --warn:#E08048; --danger:#EA6270;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans Hebrew",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
.top-in{max-width:980px;margin:0 auto;padding:14px 18px 0}
.brand{display:flex;align-items:center;gap:10px}
.mark{display:flex;gap:3px;align-items:flex-end;height:22px}
.mark i{display:block;width:5px;border-radius:2px}
.mark i:nth-child(1){height:22px;background:var(--ph-m)}
.mark i:nth-child(2){height:16px;background:var(--ph-a)}
.mark i:nth-child(3){height:10px;background:var(--ph-e)}
.word{font-weight:700;font-size:17px;letter-spacing:-.01em;direction:ltr}
.site{margin-inline-start:auto;display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:600;white-space:nowrap}
.site .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
.site bdi{letter-spacing:.02em}
.period{margin:14px 0 4px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.period h1{margin:0;font-size:28px;line-height:1.2;font-weight:700;letter-spacing:-.015em}
.period .sub{color:var(--ink-2);font-size:15px}
.tabs{display:flex;gap:4px;margin-top:14px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;padding:10px 14px 12px;color:var(--ink-2);font-weight:500;position:relative;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);font-weight:600}
.tab[aria-selected="true"]::after{content:"";position:absolute;inset:auto 10px -1px;height:3px;border-radius:3px 3px 0 0;background:var(--ink)}
.tab .count{display:inline-block;min-width:20px;padding:0 6px;margin-inline-start:6px;border-radius:10px;background:var(--surface-2);font-size:12.5px;color:var(--ink-2);border:1px solid var(--line)}

main{max-width:980px;margin:0 auto;padding:20px 18px 140px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.card h2{margin:0 0 4px;font-size:19px;font-weight:600;letter-spacing:-.01em}
.hint{margin:0 0 14px;color:var(--ink-2);font-size:14.5px;max-width:62ch}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);font-size:14.5px;margin-bottom:16px}
.banner b{color:var(--ink)}
.banner.warn{border-color:color-mix(in srgb,var(--warn) 40%,var(--line));background:color-mix(in srgb,var(--warn) 9%,var(--surface))}

/* fields */
label.lbl{display:block;font-size:14px;font-weight:500;color:var(--ink-2);margin-bottom:6px}
.in{width:100%;padding:11px 13px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);transition:border-color .15s}
.in:focus{outline:none;border-color:var(--brand)}
textarea.in{min-height:76px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ranking tiles: the signature */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{position:relative;overflow:hidden;text-align:start;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:20px 14px 14px;min-height:138px;display:flex;flex-direction:column;gap:2px;transition:border-color .2s,background .2s,transform .12s}
.tile:active{transform:scale(.98)}
.tile .rail{position:absolute;inset:0 0 auto;height:6px;background:var(--ph);opacity:.35;transition:opacity .25s,box-shadow .35s}
.tile .nm{font-weight:600;font-size:18px}
.tile .hr{color:var(--ink-3);font-size:13.5px;direction:ltr;text-align:end}
.tile .rk{margin-top:auto;align-self:flex-end;width:44px;height:44px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-weight:700;font-size:22px;color:transparent;transition:all .25s}
.tile[aria-pressed="true"]{border-color:var(--ph);background:var(--soft)}
.tile[aria-pressed="true"] .rail{opacity:1;box-shadow:0 0 18px 2px var(--ph)}
.tile[aria-pressed="true"] .rk{border:0;background:var(--ph);color:#fff}
.tile.next .rk{border-color:var(--ph);color:var(--ph)}
.tile.sm{min-height:96px;padding:14px 10px 10px}
.tile.sm .nm{font-size:15.5px}
.tile.sm .rk{width:32px;height:32px;font-size:16px}
@media (max-width:420px){.tile{min-height:122px;padding:18px 10px 10px}.tile .nm{font-size:16px}.tile .hr{font-size:12px}}
.tiles-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:14px;color:var(--ink-3)}
.link{background:none;border:0;padding:4px 2px;color:var(--brand);font-weight:500;text-decoration:underline;text-underline-offset:3px}

/* day list */
.days-list{display:flex;flex-direction:column}
.dayrow{display:grid;grid-template-columns:86px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line-2)}
.dayrow:first-child{border-top:0}
.dname{font-weight:600}
.dname small{display:block;color:var(--ink-3);font-weight:400;font-size:13px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 8px;border-radius:999px;background:var(--soft);font-size:13.5px;font-weight:500;border:1px solid color-mix(in srgb,var(--ph) 30%,transparent)}
.pill i{font-style:normal;width:18px;height:18px;border-radius:50%;background:var(--ph);color:#fff;font-size:11.5px;display:grid;place-items:center;font-weight:700}
.pill.custom{outline:1.5px solid var(--ink-3);outline-offset:1px}
.offtag{color:var(--ink-3);font-size:14px}
.dacts{display:flex;gap:6px;align-items:center}
.btn-s{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 11px;font-size:13.5px;font-weight:500}
.btn-s[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dayedit{grid-column:1/-1;padding:4px 0 6px}
@media (max-width:520px){.dayrow{grid-template-columns:1fr auto}.pills{grid-column:1/-1;order:3}}

/* buttons */
.btn{border:0;border-radius:12px;padding:13px 20px;font-weight:600;font-size:16px;background:var(--brand);color:var(--on-brand);transition:filter .15s,transform .1s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btns{display:flex;gap:10px;flex-wrap:wrap}

.savebar{position:fixed;inset:auto 0 0;z-index:6;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px))}
.savebar-in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:14px}
.savebar .st{font-size:14px;color:var(--ink-2);flex:1}
.savebar .st.dirty{color:var(--warn);font-weight:500}

/* schedule */
.mine{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.mineday{border-radius:12px;padding:10px 12px;background:var(--soft,var(--surface-2));border:1px solid var(--line);border-top:4px solid var(--ph,var(--line))}
.mineday .d{font-size:13px;color:var(--ink-2)}
.mineday .s{font-weight:600;font-size:16px}
.mineday .h{font-size:12.5px;color:var(--ink-3);direction:ltr;text-align:end}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.day-h{display:flex;justify-content:space-between;align-items:baseline}
.day-h b{font-size:17px}
.day-h span{color:var(--ink-3);font-size:13.5px}
.shift{margin-top:10px;padding:9px 11px 10px;border-radius:10px;background:var(--surface-2);border-inline-start:4px solid var(--ph)}
.shift-h{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:6px}
.shift-h b{font-weight:600}
.shift-h .cap{color:var(--ink-3)}
.shift-h .cap.short{color:var(--danger);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:5px;min-height:28px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 5px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:500}
button.chip:hover{border-color:var(--ink-3)}
.chip .r{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;color:#fff;background:var(--mid)}
.chip .r.r0{background:var(--ok)}.chip .r.r2{background:var(--warn)}
.chip.me{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.sel{outline:2px solid var(--brand);outline-offset:1px}
.empty-slot{font-size:13px;color:var(--ink-3);padding:3px 2px}
.bench{margin-top:10px;font-size:13px;color:var(--ink-3)}
.bench .chips{margin-top:4px}
.mover{margin-top:10px;padding:10px;border-radius:10px;border:1.5px dashed var(--brand);font-size:14px}
.mover .btns{margin-top:8px;gap:6px}

/* stats */
.dist{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--surface-2);margin:10px 0 8px}
.dist span{display:block;height:100%}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:middle}
.bignum{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1}

/* admin */
.daypick{display:flex;gap:6px;flex-wrap:wrap}
.daypick button{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:600}
.daypick button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.shcfg{display:grid;grid-template-columns:110px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line-2)}
.shcfg .nm{font-weight:600;display:flex;align-items:center;gap:8px}
.shcfg .nm::before{content:"";width:10px;height:22px;border-radius:3px;background:var(--ph)}
.times{display:flex;gap:6px;align-items:center;direction:ltr;justify-content:flex-end}
.times input{width:96px;padding:8px}
.stepper{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{width:36px;height:38px;border:0;background:var(--surface-2);font-size:18px}
.stepper span{min-width:36px;text-align:center;font-weight:600}
@media (max-width:560px){.shcfg{grid-template-columns:1fr auto}.times{grid-column:1/-1;justify-content:flex-start}}
.team{display:flex;flex-direction:column}
.trow{display:grid;grid-template-columns:1fr auto;gap:8px;padding:11px 0;border-top:1px solid var(--line-2);align-items:center}
.trow:first-child{border-top:0}
.trow .who{font-weight:600}
.trow .meta{font-size:13px;color:var(--ink-3)}
.trow .note{grid-column:1/-1;font-size:13.5px;color:var(--ink-2);background:var(--surface-2);padding:6px 10px;border-radius:8px}
.tag{font-size:12px;padding:2px 8px;border-radius:6px;background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn);font-weight:500;margin-inline-start:6px}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:6px}
.statgrid div small{display:block;color:var(--ink-3);font-size:13px;margin-top:4px}

.emptystate{text-align:center;padding:36px 18px;color:var(--ink-2)}
.emptystate .mark{justify-content:center;height:34px;margin-bottom:12px}
.emptystate .mark i{width:8px}
.emptystate .mark i:nth-child(1){height:34px}.emptystate .mark i:nth-child(2){height:24px}.emptystate .mark i:nth-child(3){height:14px}
.emptystate h3{margin:0 0 6px;color:var(--ink);font-size:18px}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:14.5px;opacity:0;pointer-events:none;transition:all .25s;z-index:20;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:rgba(5,12,20,.5);display:grid;place-items:center;z-index:30;padding:20px}
.modal .card{width:min(560px,100%);margin:0}
.skel{height:120px;border-radius:16px;background:linear-gradient(90deg,var(--surface) 0,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:sk 1.2s infinite linear;margin-bottom:12px}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.lock{max-width:380px;margin:20px auto;text-align:center}
.lock .ico{font-size:34px;margin-bottom:6px}
.pin{font-size:30px;letter-spacing:.5em;text-align:center;direction:ltr;padding:12px 10px 12px calc(10px + .5em);margin:6px 0 12px}
.pin.bad{border-color:var(--danger);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.lockbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:14px;color:var(--ink-3)}
.prog{display:flex;gap:4px;margin:2px 0 6px}
.prog span{flex:1;height:6px;border-radius:3px;background:var(--line);transition:background .3s}
.prog span.done{background:var(--ok)}
.progl{font-size:13.5px;color:var(--ink-3);margin-bottom:6px}
.dayblock{padding:16px 0 6px;border-top:1px solid var(--line-2)}
.dayhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.dayhead .dname{font-size:17px}
.dayhead .dname small{display:inline;margin-inline-start:4px}
.dstat{color:var(--ok);font-weight:700;font-size:18px;margin-inline-end:4px}
.tiles.one{grid-template-columns:1fr}
.tiles.one .tile{min-height:72px;flex-direction:row;align-items:center;gap:12px;padding:16px 14px 12px}
.tiles.one .tile .hr{text-align:start}
.tiles.one .tile .rk{margin:0;margin-inline-start:auto;align-self:center}
.fc{display:flex;gap:5px}
.fc span{display:inline-flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--ink-3)}
.fc b{display:block;width:16px;height:16px;border-radius:5px;background:var(--ph,var(--line))}
.saved{border-color:color-mix(in srgb,var(--ok) 35%,var(--line))}
.savedhead{display:flex;gap:14px;align-items:flex-start;margin-bottom:12px}
.bigok{flex:none;width:44px;height:44px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:700}
.sumrow{display:grid;grid-template-columns:100px 1fr;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line-2)}
.sumrow .dname small{display:inline;margin-inline-start:4px;color:var(--ink-3);font-weight:400;font-size:13px}
.sumnote{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:14.5px;color:var(--ink-2)}
.restore{margin-top:18px;text-align:center}
.restore textarea,.restore .btns{text-align:start}
.restore .btns{justify-content:center}
.ph-m{--ph:var(--ph-m);--soft:var(--ph-m-soft)}
.ph-a{--ph:var(--ph-a);--soft:var(--ph-a-soft)}
.ph-e{--ph:var(--ph-e);--soft:var(--ph-e-soft)}
.rt{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:6px;margin-inline-start:2px;color:#fff;background:var(--mid)}
.rt.r-i{background:#2F6FB5}.rt.r-l{background:#C8741A}.rt.r-n{background:#6B4FC0}
.chip.me .rt{box-shadow:0 0 0 1px rgba(255,255,255,.55)}
.rolepick{display:flex;gap:8px}
.rolepick button{flex:1;padding:12px 8px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:15px}
.rolepick button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rcfg{grid-column:1/-1;display:flex;gap:14px;flex-wrap:wrap}
.rcfg .rc{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2)}
.miss{font-size:12.5px;color:var(--danger);font-weight:600;margin-top:5px}
.chip.warn{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 11%,var(--surface));color:var(--danger);font-weight:600}
.chip .wi{font-size:13px;line-height:1;margin-inline-end:2px}
.alertcard{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 7%,var(--surface))}
.alertcard h2{color:var(--danger)}
.issue{display:flex;gap:10px;padding:10px 0;border-top:1px solid color-mix(in srgb,var(--danger) 25%,var(--line));font-size:14.5px;color:var(--ink)}
.issue>span:first-child{color:var(--danger);flex:none}
.hc{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:9px}
.hc li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.hc .ci{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;background:var(--ok)}

(function(){

  function norm(n){return String(n||"").trim().replace(/\s+/g," ").toLowerCase();}
  function h32(s,salt){var h=5381;s=salt+s;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return Math.abs(h).toString(36);}
  function makeId(n){var k=norm(n);return"u"+h32(k,"a")+h32(k,"b");}

<script>
const SH=['morning','afternoon','evening'];
const SHL={morning:'בוקר',afternoon:'ערב',evening:'לילה'};
const SHC={morning:'ph-m',afternoon:'ph-a',evening:'ph-e'};
const DAYN=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const DAYS=['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
const RANKW=['עדיפות 1','עדיפות 2','עדיפות 3'];
const ROLES=['insp','load','night'];
const ROLEFULL={insp:'בודק CX',load:'עומסים',night:'בודק CX'};
const ROLESHORT={insp:'בודק CX',load:'עומסים',night:'בודק CX'};
const ROLEC={insp:'r-i',load:'r-l',night:'r-i'};
const ROLEORD={insp:0,load:1,night:2};
const capsOf=p=>p&&Array.isArray(p.roles)&&p.roles.length?p.roles:['insp','load'];
const canDo=(p,r)=>r==='load'?capsOf(p).includes('load'):capsOf(p).includes('insp');

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parseYmd=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const dm=d=>d.getDate()+'.'+(d.getMonth()+1);
const dayDiff=(a,b)=>Math.round((b-a)/864e5);
const clone=o=>JSON.parse(JSON.stringify(o));
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return Math.abs(h)}
function nextSunday(){const t=new Date();t.setHours(0,0,0,0);t.setDate(t.getDate()+((7-t.getDay())%7||7));return ymd(t)}
function defaults(){return{start:nextSunday(),days:[0,1,2,3,4,5],need:{morning:{insp:2,load:1,night:0},afternoon:{insp:1,load:1,night:0},evening:{insp:0,load:0,night:1}},hours:{morning:['08:00','17:00'],afternoon:['14:00','23:00'],evening:['23:00','07:00']},fri:{need:{insp:1,load:1,night:0},hours:['07:00','13:00']},deadline:'',rest:8}}
function normNeed(n,d){const o={};ROLES.forEach(r=>{const v=n?Number(n[r]):NaN;o[r]=Number.isFinite(v)?Math.max(0,Math.min(30,Math.round(v))):d[r]});return o}
function normSettings(s){const d=defaults();if(!s)return d;const need={};SH.forEach(sh=>{need[sh]=normNeed(s.need&&s.need[sh],d.need[sh])});return{start:s.start||d.start,days:Array.isArray(s.days)?s.days.slice():d.days,need,hours:{...d.hours,...(s.hours||{})},fri:{need:normNeed(s.fri&&s.fri.need,d.fri.need),hours:(s.fri&&Array.isArray(s.fri.hours))?s.fri.hours.slice():d.fri.hours},deadline:s.deadline||'',rest:Number.isFinite(s.rest)?Math.max(0,Math.min(16,Math.round(s.rest))):d.rest}}
function emptyPrefs(){return{name:'',roles:[],order:[],days:{},note:'',period:'',updatedAt:0}}
function normPrefs(p){const e=emptyPrefs();if(!p)return e;const r={name:p.name||'',order:Array.isArray(p.order)?p.order.filter(x=>SH.includes(x)):[],days:p.days&&typeof p.days==='object'?clone(p.days):{},note:p.note||'',period:p.period||'',updatedAt:p.updatedAt||0,complete:p.complete!==false,roles:Array.isArray(p.roles)?p.roles.filter((x,i,a)=>(x==='insp'||x==='load')&&a.indexOf(x)===i):[]};
  if(r.order.length===3){for(let w=0;w<7;w++){if(w===FRI)continue;const d=r.days[w]||{};if(!d.off&&!(Array.isArray(d.order)&&d.order.length===3)){d.order=r.order.slice();r.days[w]=d}}r.order=[]}
  return r}
function periodDays(s){const out=[],st=parseYmd(s.start);for(let i=0;i<7;i++){const d=new Date(st);d.setDate(st.getDate()+i);if(s.days.includes(d.getDay()))out.push({w:d.getDay(),date:d,key:ymd(d)})}return out}
function rangeLabel(s){const ds=periodDays(s);if(!ds.length)return'';return ds.length===1?dm(ds[0].date):dm(ds[0].date)+'–'+dm(ds[ds.length-1].date)}
const hrs=(s,sh)=>s.hours[sh][0]+'–'+s.hours[sh][1];
const FRI=5;
const dayShifts=w=>w===FRI?['morning']:SH;
const NONEED={insp:0,load:0,night:0};
const needOf=(s,w,sh)=>w===FRI?(sh==='morning'?s.fri.need:NONEED):s.need[sh];
const capOf=(s,w,sh)=>{const n=needOf(s,w,sh);return n.insp+n.load+n.night};
function slotRoles(s,w,sh){const n=needOf(s,w,sh),o=[];ROLES.forEach(r=>{for(let k=0;k<n[r];k++)o.push(r)});return o}
const hrsOf=(s,w,sh)=>w===FRI&&sh==='morning'?s.fri.hours[0]+'–'+s.fri.hours[1]:hrs(s,sh);
const isOff=(p,w)=>!!(p.days&&p.days[w]&&p.days[w].off);
function dayOrder(p,w){const d=p.days&&p.days[w];const need=w===FRI?1:3;if(d&&Array.isArray(d.order)&&d.order.length===need)return d.order;if(w!==FRI&&p.order&&p.order.length===3)return p.order;return null}
function dayDone(p,w){return isOff(p,w)||!!dayOrder(p,w)}
function missingDays(p){return periodDays(S.settings).filter(d=>!dayDone(p,d.w))}
function rankOf(p,w,sh){const o=dayOrder(p,w);return o?o.indexOf(sh):1}
function complete(p){return !!p.name.trim()&&(p.roles||[]).length>0&&missingDays(p).length===0}

/* ---------- scheduling engine: per-day optimal assignment (Hungarian) with weekly fairness ---------- */
function hungarian(a){const n=a.length,m=a[0].length,INF=1e15;const u=Array(n+1).fill(0),v=Array(m+1).fill(0),p=Array(m+1).fill(0),way=Array(m+1).fill(0);
  for(let i=1;i<=n;i++){p[0]=i;let j0=0;const minv=Array(m+1).fill(INF),used=Array(m+1).fill(false);
    do{used[j0]=true;const i0=p[j0];let delta=INF,j1=0;
      for(let j=1;j<=m;j++)if(!used[j]){const cur=a[i0-1][j-1]-u[i0]-v[j];if(cur<minv[j]){minv[j]=cur;way[j]=j0}if(minv[j]<delta){delta=minv[j];j1=j}}
      for(let j=0;j<=m;j++){if(used[j]){u[p[j]]+=delta;v[j]-=delta}else minv[j]-=delta}
      j0=j1}while(p[j0]!==0);
    do{const j1=way[j0];p[j0]=p[j1];j0=j1}while(j0)}
  const ans=Array(n);for(let j=1;j<=m;j++)if(p[j])ans[p[j]-1]=j-1;return ans}

/* ---------- rest between shifts ---------- */
const toMin=t=>{const [h,m]=String(t||'0:0').split(':').map(Number);return(h||0)*60+(m||0)};
function spanOf(s,key,w,sh){const [y,mo,d]=key.split('-').map(Number);const base=Date.UTC(y,mo-1,d)/60000;
  const hr=(w===FRI&&sh==='morning')?s.fri.hours:s.hours[sh];const a=toMin(hr[0]),b0=toMin(hr[1]);return{a:base+a,b:base+(b0<=a?b0+1440:b0)}}
const shiftLen=(s,w,sh)=>{const p=spanOf(s,'2026-01-05',w,sh);return(p.b-p.a)/60};
const numHe=n=>String(Math.round(n*10)/10);
const hoursHe=n=>n<0?'חפיפה בין המשמרות':n===0?'ללא מנוחה':n===1?'שעה אחת':numHe(n)+' שעות';
function restIssues(s,sc){const per={};
  Object.keys(sc.days||{}).sort().forEach(key=>{const w=parseYmd(key).getDay();dayShifts(w).forEach(sh=>(sc.days[key][sh]||[]).forEach(id=>{(per[id]=per[id]||[]).push({key,sh,w,...spanOf(s,key,w,sh)})}))});
  const out=[];Object.keys(per).forEach(id=>{const l=per[id].sort((x,y)=>x.a-y.a);for(let i=1;i<l.length;i++){const gap=(l[i].a-l[i-1].b)/60;if(gap<s.rest)out.push({id,name:(sc.people&&sc.people[id])||'?',prev:l[i-1],next:l[i],gap})}});
  return out}
const issueText=(i,s)=>`${i.name}: משמרת ${SHL[i.prev.sh]} (${DAYS[i.prev.w]} ${dm(parseYmd(i.prev.key))}) ואחריה משמרת ${SHL[i.next.sh]} (${DAYS[i.next.w]} ${dm(parseYmd(i.next.key))}). מנוחה בין המשמרות: ${hoursHe(i.gap)}. מינימום נדרש: ${hoursHe(s.rest)}.`;
const durSpan=(id,len)=>`<span class="dur num${len>10?' bad':''}" id="${id}">${numHe(len)} שעות${len>10?' · מעל 10':''}</span>`;
function setDur(e,len){e.textContent=numHe(len)+' שעות'+(len>10?' · מעל 10':'');e.classList.toggle('bad',len>10)}
function updDur(){const d=S.setDraft;if(!d)return;SH.forEach(sh=>{const e=document.getElementById('dur-'+sh);if(e)setDur(e,shiftLen(d,0,sh))});const f=document.getElementById('dur-fri');if(f)setDur(f,shiftLen(d,FRI,'morning'))}
const cntHe=(n,one,many)=>n===1?one:n+' '+many;
function healthHTML(sc){const s=S.settings,iss=restIssues(s,sc),short=shortages(s,sc);
  const longs=[...SH.map(sh=>[SHL[sh],shiftLen(s,0,sh)]),['שישי בוקר',shiftLen(s,FRI,'morning')]].filter(x=>x[1]>10);
  const row=(ok,t)=>`<li class="${ok?'':'bad'}"><span class="ci" aria-hidden="true">${ok?'✓':'✕'}</span><span>${t}</span></li>`;
  const hrs={};Object.keys(sc.days||{}).forEach(k=>{const w=parseYmd(k).getDay();dayShifts(w).forEach(sh=>(sc.days[k][sh]||[]).forEach(id=>{hrs[id]=(hrs[id]||0)+shiftLen(s,w,sh)}))});
  const list=Object.keys(hrs).sort((a,b)=>hrs[b]-hrs[a]),mx=Math.max(1,...list.map(id=>hrs[id]));
  let h=`<section class="card"><h2>בדיקות תקינות</h2><ul class="hc">${row(!short,short?`${short===1?'משבצת אחת חסרה':short+' משבצות חסרות'} בסידור`:'כל המשמרות והתפקידים מאוישים')}${row(!iss.length,iss.length?`${iss.length===1?'שיבוץ אחד':iss.length+' שיבוצים'} עוקבים ללא מנוחה מספקת`:`אין שיבוצים עוקבים ללא מנוחה (מינימום ${hoursHe(s.rest)})`)}${row(!longs.length,longs.length?`משמרת ${longs.map(x=>x[0]).join(', ')} ארוכה מ-10 שעות`:'כל המשמרות עד 10 שעות')}</ul>`;
  if(list.length)h+=`<h3 class="subh">שעות עבודה בשבוע</h3><div class="hrs">${list.map(id=>`<div><span>${esc(sc.people[id]||'?')}</span><span class="trk"><i style="width:${Math.round(hrs[id]/mx*100)}%"></i></span><b class="num">${numHe(hrs[id])}</b></div>`).join('')}</div>`;
  h+='</section>';
  if(iss.length)h+=`<section class="card alertcard" role="alert"><h2>⚠️ אין מנוחה מספקת בין משמרות</h2><p class="hint">לא ניתן לשבץ משמרת מיד אחרי משמרת אחרת. הזז אחד מהשיבוצים המסומנים באדום.</p>${iss.map(i=>`<div class="issue"><span aria-hidden="true">⚠</span><span>${esc(issueText(i,s))}</span></div>`).join('')}</section>`;
  return h}
function snack(msg,undo,warn){let el=document.getElementById('snack');if(!el){el=document.createElement('div');el.id='snack';el.setAttribute('role','status');document.body.appendChild(el)}
  el.className='snack on'+(warn?' warn':'');el.innerHTML='';const t=document.createElement('span');t.textContent=msg;el.appendChild(t);
  if(undo){const b=document.createElement('button');b.textContent='בטל';b.onclick=()=>{undo();el.classList.remove('on')};el.appendChild(b)}
  clearTimeout(snack._t);snack._t=setTimeout(()=>el.classList.remove('on'),warn?7000:5000)}
function rolesFor(s,w,sh,ids,team){
  const slots=slotRoles(s,w,sh),out={};if(!ids.length)return out;
  const m=Math.max(ids.length,slots.length);
  const cost=ids.map(id=>Array.from({length:m},(_,j)=>{const r=slots[j];if(!r)return .5;return canDo(team[id],r)?0:5}));
  const asg=hungarian(cost);
  ids.forEach((id,i)=>{const r=slots[asg[i]];out[id]=(r&&canDo(team[id],r))?r:(capsOf(team[id]).includes('insp')?'insp':'load')});
  return out}
function recomputeRoles(sc,s,team){s=s||S.settings;team=team||teamAll();sc.roles={};
  Object.keys(sc.days).forEach(k=>{const w=parseYmd(k).getDay();const r={};dayShifts(w).forEach(sh=>Object.assign(r,rolesFor(s,w,sh,sc.days[k][sh]||[],team)));sc.roles[k]=r})}
function missingRoles(s,w,sh,roles,ids){const need=needOf(s,w,sh),got={insp:0,load:0,night:0};ids.forEach(id=>{const r=roles&&roles[id];if(r&&got[r]!=null)got[r]++});const out={};ROLES.forEach(r=>{const m=need[r]-got[r];if(m>0)out[r]=m});return out}
function buildSchedule(s,team){
  const ids=Object.keys(team).filter(id=>team[id]&&team[id].name);
  const debt={},offc={},last={};ids.forEach(i=>{debt[i]=0;offc[i]=0});

    const slots=[];dayShifts(day.w).forEach(sh=>slotRoles(s,day.w,sh).forEach(role=>slots.push({sh,role})));

const IMGFF='"IBM Plex Sans Hebrew","Heebo","Noto Sans Hebrew",system-ui,Arial,sans-serif';
const IMGSH={morning:{c:'#C98A10',s:'#FBF1DC'},afternoon:{c:'#1B7FB0',s:'#E1F0F8'},evening:{c:'#5B4DC9',s:'#ECE9FA'}};
const IMGRC={insp:'#2F6FB5',load:'#C8741A',night:'#2F6FB5'};
function imgModel(sc){
  const keys=Object.keys(sc.days||{}).sort();

function imgRR(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
async function schedCanvas(sc){

  const m=imgModel(sc),N=Math.max(1,m.days.length);
  const PAD=40,LAB=230,COL=276,LH=50,CPAD=18,MINH=156,HEAD=190,DAYH=92,FOOT=130,GAP=10;
  const W=PAD*2+LAB+N*COL;

  let NSZ=28;m.days.forEach(d=>d.shifts.forEach(c=>c.people.forEach(p=>{const pw=p.role?MW(ROLESHORT[p.role],19,700)+22:0;NSZ=Math.min(NSZ,FIT(p.name,COL-12-32-(pw?pw+10:0),28,700))})));
  ctx.fillStyle='#F5F2EC';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#14213D';ctx.fillRect(0,0,W,HEAD);
  ctx.fillStyle='#E7A93A';ctx.fillRect(0,HEAD-8,W,8);
  T('סידור משמרות',W-PAD,70,{s:62,w:700,c:'#FFFFFF'});
  T('CXelectra · אתר בית שמש MDCIL4',W-PAD,138,{s:30,w:500,c:'#E7A93A'});
  T('שבוע '+m.range,PAD,70,{s:44,w:700,c:'#FFFFFF',a:'left',dir:'ltr'});

    T(d.label,x+(COL-12)/2,y+26,{s:32,w:700,a:'center'});T(d.date,x+(COL-12)/2,y+54,{s:24,w:500,c:'#6B665C',a:'center',dir:'ltr'})});
  y=HEAD+DAYH+12;
  rows.forEach(r=>{const col=IMGSH[r.sh];
    imgRR(ctx,x0+6,y,LAB-6,r.h,14);ctx.fillStyle=col.s;ctx.fill();ctx.fillStyle=col.c;ctx.fillRect(x0+LAB-12,y+10,8,r.h-20);
    const cx=x0+6+(LAB-24)/2;T(SHL[r.sh],cx,y+r.h/2-34,{s:38,w:700,c:col.c,a:'center'});
    const hr=((m.days.find(d=>d.shifts.some(x=>x.sh===r.sh))||{shifts:[]}).shifts.find(x=>x.sh===r.sh)||{}).hours||'';
    T(hr,cx,y+r.h/2+8,{s:28,w:600,c:'#1B1A17',a:'center',dir:'ltr'});
    if(r.sh==='evening')T('בדיקות ומצברים',cx,y+r.h/2+46,{s:20,w:500,c:'#6B665C',a:'center'});
    m.days.forEach((d,i)=>{const x=dayX(i)+6,w=COL-12,cell=d.shifts.find(z=>z.sh===r.sh);

      if(!cell.people.length){T('אין שיבוץ',x+w/2,y+r.h/2,{s:24,c:'#B04A3F',w:600,a:'center'});return}

  T('הופק '+new Date().toLocaleDateString('he-IL',{day:'numeric',month:'numeric',year:'numeric'})+' · CXelectra',PAD,ly,{s:21,w:500,c:'#8A857A',a:'left',dir:'ltr'});

  const can=typeof navigator.canShare==='function',clip=!!(window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write),app=imgInApp();
  const m=document.createElement('div');m.id='imgmodal';m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');m.setAttribute('aria-label','תצוגת תמונה של הסידור');
  m.style.cssText='position:fixed;inset:0;z-index:9999;background:rgba(14,20,35,.94);overflow:auto;-webkit-overflow-scrolling:touch;padding:14px 12px 40px';
  const diag='אבחון: '+(app?'אפליקציה':'דפדפן')+(/; wv\)/.test(navigator.userAgent)?' (WebView)':'')+' · חלון שמירה: '+(typeof window.showSaveFilePicker==='function'?'כן':'לא')+' · שיתוף: '+(can?'כן':'לא')+' · העתקת תמונה: '+(clip?'כן':'לא');
  m.innerHTML=`<div class="imgbar" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"><button class="btn" data-action="imgSave">שמור…</button>${can?'<button class="btn" data-action="imgShare">שתף</button>':''}<button class="btn ghost" data-action="imgText">העתק כטקסט</button>${clip?'<button class="btn ghost" data-action="imgCopy">העתק תמונה</button>':''}<button class="btn ghost" data-action="imgShot">מצב צילום מסך</button>${app?'<button class="btn ghost" data-action="imgChrome">פתח ב-Chrome</button>':''}<button class="btn ghost" data-action="imgClose">סגור</button></div><p class="imgbar" style="color:#fff;font-size:15px;line-height:1.5;margin:0 0 12px">לא נשמר? נסה <b>שתף</b>, או <b>העתק כטקסט</b> ושלח בוואטסאפ, או <b>מצב צילום מסך</b> וצלם מסך. אפשר גם ללחוץ והחזק על התמונה.</p>`;
  const im=document.createElement('img');im.alt='סידור משמרות';im.src=data||imgM.url;im.style.cssText='width:100%;height:auto;border-radius:12px;background:#fff;display:block';m.appendChild(im);
  const dg=document.createElement('p');dg.className='imgbar';dg.style.cssText='color:#9AA6B8;font-size:12.5px;margin:12px 0 0';dg.textContent=diag;m.appendChild(dg);
  document.body.appendChild(m);const f0=m.querySelector('button');if(f0)f0.focus()}
async function imgSave(){if(!imgM.blob&&!imgM.data)return;
  if(imgM.blob&&typeof window.showSaveFilePicker==='function'){
    try{const h=await window.showSaveFilePicker({suggestedName:imgM.name,types:[{description:'תמונה',accept:{'image/png':['.png']}}]});const wr=await h.createWritable();await wr.write(imgM.blob);await wr.close();toast('התמונה נשמרה');return}
    catch(e){if(e&&e.name==='AbortError')return}
  }
  imgDl()}
function imgDl(){const href=imgM.url||imgM.data;if(!href)return;const a=document.createElement('a');a.href=href;a.download=imgM.name;document.body.appendChild(a);a.click();a.remove();toast('ההורדה התחילה. אם אין קובץ, נסה שתף, העתק כטקסט או מצב צילום מסך')}
async function imgShareNow(){if(!imgM.blob)return;const f=new File([imgM.blob],imgM.name,{type:'image/png'});
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'סידור משמרות'});return}}catch(e){if(e&&e.name==='AbortError')return}
  toast('שיתוף תמונה לא נתמך כאן. נסה העתק כטקסט או מצב צילום מסך')}
async function imgCopy(){if(!imgM.blob)return;try{await navigator.clipboard.write([new ClipboardItem({'image/png':imgM.blob})]);toast('התמונה הועתקה. הדבק בוואטסאפ')}catch(e){toast('העתקת תמונה לא נתמכת כאן. נסה העתק כטקסט או מצב צילום מסך')}}
function imgShot(){const m=document.getElementById('imgmodal');if(!m)return;m.classList.add('shot');toast('צלם מסך עכשיו. הקש על המסך כדי לחזור');
  setTimeout(()=>m.addEventListener('click',()=>m.classList.remove('shot'),{once:true}),500)}

/* ---------- autosave ---------- */
let saveT=null;S.ver=0;
const draftKey=()=>S.mode==='live'?'cx_draft_'+S.uid:'cx_me';
function prefsData(){const p=S.me;return{name:p.name.trim(),roles:(p.roles||[]).slice(),order:[],days:clone(p.days),note:p.note.trim(),period:S.settings.start,updatedAt:Date.now(),complete:complete(p)}}
function scheduleSave(){S.ver++;clearTimeout(saveT);LS.set(draftKey(),prefsData());saveT=setTimeout(doSave,900)}
function saveErrText(e){const c=String((e&&e.code)||'');
  if(/permission/i.test(c))return'השרת דחה את הפעולה (PERMISSION_DENIED). ב-Firebase Console, תחת Realtime Database ואז Rules, צריך לוודא שהנתיב checklists פתוח לקריאה וכתיבה, כולל תתי-נתיבים.';
  if(c==='timeout')return'אין תקשורת עם השרת. בדוק חיבור לאינטרנט. הבחירות שמורות במכשיר.';
  return'השמירה נכשלה'+(c?' ('+c+')':(e&&e.message?' ('+e.message+')':''))+'. הבחירות שמורות במכשיר.'}
async function runDiag(){
  const L=[];L.push('מצב: '+(S.mode==='live'?'מחובר לשרת':'מקומי בלבד'));
  if(S.mode!=='live'){L.push('סיבה: '+(S.connErr||'ספריית Firebase לא נטענה'));S.diagText=L.join('\n');render();return}
  L.push('משתמש: '+S.uid);
  try{await S.db.doc('_diag/'+S.uid).set({t:Date.now()});L.push('כתיבה לשרת: הצליחה')}catch(e){L.push('כתיבה לשרת: נכשלה. '+saveErrText(e))}
  try{const r=await S.db.collection('prefs').get();const ok=r.docs.filter(d=>d.exists);L.push('העדפות שמורות בשרת: '+ok.length);ok.forEach(d=>L.push('• '+(normPrefs(d.data()).name||d.id)))}catch(e){L.push('קריאה מהשרת: נכשלה. '+saveErrText(e))}
  S.diagText=L.join('\n');render()}
function srvFail(e){S.saveErr=true;S.saveErrMsg=saveErrText(e);render()}
async function doSave(){clearTimeout(saveT);saveT=null;const v=S.ver;const data=prefsData();LS.set(draftKey(),data);
  if(S.mode==='live'&&data.name){S.saving=true;renderBar();
    try{await S.db.doc('prefs/'+S.uid).set(data);S.saveErr=false;S.saveErrMsg=''}
    catch(e){S.saveErr=true;S.saveErrMsg=saveErrText(e);toast(S.saveErrMsg);render()}
    S.saving=false}
  S.savedAt=data.updatedAt;S.me.updatedAt=data.updatedAt;S.me.period=data.period;if(S.ver===v)S.dirty=false;renderBar()}
function touch(){S.dirty=true;S.editing=true;scheduleSave();render()}
const summaryMode=()=>complete(S.me)&&!!S.savedAt&&!S.editing&&!S.dirty;
const flush=()=>{if(saveT)doSave()};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flush()});
window.addEventListener('pagehide',flush);

/* ---------- actions ---------- */
function markDirty(){S.dirty=true;S.editing=true;scheduleSave();renderBar()}
function rankToggle(arr,sh){const i=arr.indexOf(sh);if(i>=0){arr.splice(i,1)}else if(arr.length<3){arr.push(sh);if(arr.length===2)arr.push(SH.find(x=>!arr.includes(x)))}return arr}
function recomputeRanks(sc){const team=teamAll();Object.keys(sc.days).forEach(k=>{const w=parseYmd(k).getDay();const rk={};SH.forEach(sh=>(sc.days[k][sh]||[]).forEach(id=>{if(team[id])rk[id]=rankOf(team[id],w,sh)}));sc.ranks[k]=rk})}
function schedText(sc){const s=S.settings;let t=`סידור משמרות CXelectra\nאתר בית שמש MDCIL4\nשבוע ${rangeLabel(s)}\n`;
  Object.keys(sc.days).sort().forEach(k=>{const d=parseYmd(k);t+=`\n${DAYN[d.getDay()]} ${dm(d)}\n`;dayShifts(d.getDay()).forEach(sh=>{t+=`${SHL[sh]} ${hrsOf(s,d.getDay(),sh)}: ${(sc.days[k][sh]||[]).map(id=>sc.people[id]+(myRole(sc,k,id)?' ('+ROLEFULL[myRole(sc,k,id)]+')':'')).join(', ')||'אין שיבוץ'}\n`})});return t}
async function writeDoc(path,data){try{await S.db.doc(path).set(data);return true}catch(e){toast(saveErrText(e));return false}}

const A={
  tab(b){S.tab=b.dataset.tab;S.moving=null;render();window.scrollTo({top:0})},
  rank(b){const sh=b.dataset.shift,w=+b.dataset.day;const dd=S.me.days[w]||(S.me.days[w]={});dd.off=false;if(!Array.isArray(dd.order))dd.order=[];
    if(w===FRI)dd.order=dd.order[0]===sh?[]:[sh];else rankToggle(dd.order,sh);touch()},
  copyDay(b){const w=+b.dataset.day,src=(S.me.days[w]||{}).order;if(!src||src.length!==3)return;periodDays(S.settings).forEach(d=>{if(d.w===w||d.w===FRI)return;const dd=S.me.days[d.w]||(S.me.days[d.w]={});if(!dd.off)dd.order=src.slice()});touch();toast('הסדר הועתק לשאר הימים')},
  dayClear(b){const dd=S.me.days[b.dataset.day];if(dd)dd.order=[];touch()},
  clearOrder(){S.me.order=[];touch()},
  dayEdit(b){const w=+b.dataset.day;S.editDay=S.editDay===w?null:w;render()},
  dayReset(b){const dd=S.me.days[b.dataset.day];if(dd)delete dd.order;S.editDay=null;touch()},
  dayOff(b){const w=b.dataset.day;const dd=S.me.days[w]||(S.me.days[w]={});dd.off=!dd.off;if(dd.off&&S.editDay===+w)S.editDay=null;touch()},
  async savePrefs(){if(!S.me.name.trim())return;await doSave();if(!S.saveErr&&complete(S.me)){S.editing=false;render();window.scrollTo({top:0})}if(!S.saveErr)toast(missingDays(S.me).length?'נשמר. אפשר להשלים את שאר הימים אחר כך':(S.mode==='live'?'ההעדפות נשמרו ונשלחו למנהל':'נשמר. עכשיו העתק את הקוד ושלח למנהל'))},
  editPrefs(){S.editing=true;render();window.scrollTo({top:0})},
  restoreCode(){const ta=document.getElementById('rcode');const it=decodeCodes(ta?ta.value:'')[0];if(!it){toast('לא נמצא קוד תקין. ודא שהעתקת את כל הקוד, כולל CXE:');return}S.me=normPrefs(it.p);touch();toast('הבחירות שוחזרו ונשמרו')},
  copyCode(){if(!complete(S.me))return;copyText(encodeCode(S.mode==='live'?'x-'+hash(S.uid):'x-'+S.lid,{...S.me,period:S.settings.start,updatedAt:S.me.updatedAt||Date.now()}),'הקוד הועתק. שלח אותו למנהל')},
  toggleDay(b){const w=+b.dataset.day,d=S.setDraft.days;const i=d.indexOf(w);i>=0?d.splice(i,1):d.push(w);d.sort();renderMain()},
  role(b){const r=b.dataset.role;S.me.roles=r==='both'?['insp','load']:[r];touch()},
  capFri(b){const n=S.setDraft.fri.need,r=b.dataset.role;n[r]=Math.max(0,Math.min(30,(n[r]||0)+(+b.dataset.d)));renderMain()},
  cap(b){const n=S.setDraft.need[b.dataset.sh],r=b.dataset.role;n[r]=Math.max(0,Math.min(30,(n[r]||0)+(+b.dataset.d)));renderMain()},
  async dlImg(b){await imgShow(b)},
  imgDl(){imgDl()},
  async imgSave(){await imgSave()},
  async imgShare(){await imgShareNow()},
  imgClose(){imgClose()},
  imgText(){if(imgM.sc)copyText(schedText(imgM.sc),'הסידור הועתק כטקסט. הדבק בוואטסאפ')},
  async imgCopy(){await imgCopy()},
  imgShot(){imgShot()},
  imgChrome(){imgOpenChrome()},
  async saveSettings(){const s=normSettings(S.setDraft);if(!s.days.length){toast('בחר לפחות יום עבודה אחד');return}
    if(S.mode==='live'){if(!await writeDoc('config/settings',s))return}else LS.set('cx_settings',s);
    S.settings=clone(s);if(S.draft&&S.draft.period!==s.start)S.draft=null;render();toast('ההגדרות נשמרו')},
  runAuto(){S.draft=buildSchedule(S.settings,teamAll());LS.set('cx_sdraft',S.draft);S.moving=null;render();toast('השיבוץ מוכן. אפשר לערוך לפני פרסום')},
  chip(b){const k=b.dataset.key,id=b.dataset.id;S.moving=(S.moving&&S.moving.key===k&&S.moving.id===id)?null:{key:k,id};renderMain()},
  moveCancel(){S.moving=null;renderMain()},
  moveTo(b){const {key,id}=S.moving,o=S.draft.days[key],st=S.settings;const before=clone(S.draft);const nb=restIssues(st,S.draft).filter(i=>i.id===id).length;
    SH.forEach(sh=>o[sh]=(o[sh]||[]).filter(x=>x!==id));if(b.dataset.sh)o[b.dataset.sh].push(id);
    recomputeRanks(S.draft);recomputeRoles(S.draft);LS.set('cx_sdraft',S.draft);S.moving=null;renderMain();
    const nm=S.draft.people[id]||'',na=restIssues(st,S.draft).filter(i=>i.id===id).length;
    const undo=()=>{S.draft=before;LS.set('cx_sdraft',S.draft);renderMain()};
    if(na>nb)snack('⚠️ '+nm+': אין מנוחה מספקת בין המשמרות. נדרשות '+hoursHe(st.rest),undo,true);
    else snack(b.dataset.sh?nm+' הועבר ל'+SHL[b.dataset.sh]:nm+' הוסר מהמשמרת',undo,false)},
  rest(b){S.setDraft.rest=Math.max(0,Math.min(16,(S.setDraft.rest||0)+(+b.dataset.d)));renderMain()},
  async publish(){const st=S.settings,ni=restIssues(st,S.draft).length,nsh=shortages(st,S.draft);
    if((ni||nsh)&&!confirm('בסידור יש '+(ni?cntHe(ni,'שיבוץ אחד','שיבוצים')+' ללא מנוחה מספקת':'')+(ni&&nsh?' ו':'')+(nsh?(nsh===1?'משבצת אחת חסרה':nsh+' משבצות חסרות'):'')+'. לפרסם בכל זאת?'))return;
    const data={...clone(S.draft),publishedAt:Date.now()};
    if(S.mode==='live'){if(!await writeDoc('config/schedule',data))return;toast('הסידור פורסם לצוות')}else{LS.set('cx_schedule',data);toast('הסידור נשמר. העתק אותו כטקסט ושלח לצוות')}
    S.schedule=data;render()},
  copySched(){copyText(schedText(S.draft),'הסידור הועתק')},
  async importCodes(){const ta=document.getElementById('codes');const items=decodeCodes(ta.value);if(!items.length){toast('לא נמצא קוד תקין. ודא שהעתקת את כל הקוד, כולל CXE:');return}
    for(const it of items){const p=normPrefs(it.p);const id=String(it.id).replace(/[^A-Za-z0-9_\-]/g,'').slice(0,40)||('x-'+Math.random().toString(36).slice(2,8));
      if(S.mode==='live'){await writeDoc('prefs/'+id,p)}else S.team[id]=p}
    if(S.mode==='local')LS.set('cx_team',S.team);ta.value='';render();toast(items.length===1?'נוסף איש צוות אחד':`נוספו ${items.length} אנשי צוות`)},
  async removePerson(b){const id=b.dataset.id;if(S.mode==='live'){try{await S.db.doc('prefs/'+id).delete()}catch(e){toast('ההסרה נכשלה')}}else{delete S.team[id];LS.set('cx_team',S.team)}render()},
  unlock(){const el=document.getElementById('pin');if(!el)return;if(hash('cxe-pin-'+el.value.trim())===PIN_H){S.unlocked=true;try{sessionStorage.setItem('cx_unlock','1')}catch(e){}watchTeam();render();toast('ברוך הבא, מנהל')}else{el.value='';el.classList.remove('bad');void el.offsetWidth;el.classList.add('bad');toast('קוד שגוי');el.focus()}},
  diag(){runDiag()},
  retry(){location.reload()},
  switchUser(){try{localStorage.removeItem('cx_ident')}catch(e){}location.reload()},
  lock(){S.unlocked=false;S.moving=null;try{sessionStorage.removeItem('cx_unlock')}catch(e){}render()},
  closeModal(){document.getElementById('modal').innerHTML=''}
};
const B={
  name(t){S.me.name=t.value;markDirty()},
  note(t){S.me.note=t.value;markDirty()},
  start(t){if(t.value)S.setDraft.start=t.value},
  deadline(t){S.setDraft.deadline=t.value},
  frih(t){if(t.value){S.setDraft.fri.hours[+t.dataset.i]=t.value;updDur()}},
  hour(t){if(t.value){S.setDraft.hours[t.dataset.sh][+t.dataset.i]=t.value;updDur()}}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;if(b.dataset.action==='closeModal'&&e.target!==b&&!e.target.closest('button'))return;const f=A[b.dataset.action];if(f)f(b,e)});
document.addEventListener('keydown',e=>{const t=e.target;if(e.key==='Enter'&&t.dataset&&t.dataset.enter&&A[t.dataset.enter]){e.preventDefault();A[t.dataset.enter](t)}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.bind&&B[t.dataset.bind])B[t.dataset.bind](t)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('imgmodal'))imgClose()});
init();
